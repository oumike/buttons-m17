# buttons-m17 — internet-only M17 voice client for ESP32-S3.
#
# Framework: Arduino-ESP32 (core 2.0.17 on ESP-IDF 4.4 via espressif32@7.0.1),
# with all real work in FreeRTOS tasks. Arduino gives us WebServer, DNSServer,
# ESPmDNS, Preferences (NVS) and Update (OTA) out of the box, which is most of
# the skeleton and OTA; the I2S and timing-critical paths drop to the IDF
# driver APIs directly where Arduino's wrappers get in the way.
#
# Protocol code (src/m17, config validation) has no hardware calls, so it builds and tests on the host:
#
#     pio test -e native        (or scripts/test.sh)

[platformio]
default_envs = wio-tracker-l2
# Optional, gitignored: one machine's choice of PlatformIO core dir, as in
# camillia-mt. See scripts/lib/pio_core.sh.
extra_configs = platformio_local*.ini

# ── Seeed Wio Tracker L2 ─────────────────────────────────────────────────────
# ESP32-S3, 16 MB flash, 8 MB octal PSRAM. Pin map in src/board_config.h,
# transcribed from camillia-mt's hal/hw_wio_tracker_l2.h.
[env:wio-tracker-l2]
platform  = espressif32@7.0.1
board     = wio-tracker-l2
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = partitions_16mb_wio.csv

extra_scripts =
    pre:tools/set_app_version.py

build_flags =
    -DDEVICE_WIO_TRACKER_L2=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -Isrc
    -std=gnu++17
    -Wall

build_unflags =
    -std=gnu++11

test_ignore = native/*

# ── Host unit tests ──────────────────────────────────────────────────────────
# Only hardware-free sources are compiled here; add each new pure module to
# build_src_filter as it lands.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_filter = native/*
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Isrc
build_src_filter =
    -<*>
    +<app/ptt.cpp>
    +<audio/dsp.cpp>
    +<config/settings.cpp>
    +<config/backup.cpp>
    +<config/reflectors.cpp>
    +<config/reflectors_builtin.cpp>
    +<m17/*.cpp>
    +<ui/html_util.cpp>
    +<ui/http_guard.cpp>
